repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=10240']

  - repo: local
    hooks:
      - id: black
        name: black
        entry: .venv/bin/black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: .venv/bin/isort --profile black
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: .venv/bin/flake8
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy main.py utils/
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: .venv/bin/bandit -r main.py utils/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest (unit tests & coverage)
        entry: .venv/bin/pytest --cov=utils --cov-report=term-missing tests/
        language: system
        types: [python]
        pass_filenames: false
